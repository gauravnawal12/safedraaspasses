<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B1E4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SR Passes">

<title>Safed Raas 2.0 Passes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1B1E4A; --ink:#1B1E4A; --muted:#62668C; --bg:#F2F3F8; --paper:#FFFFFF; --line:#DDE0EC;
  --gold:#F2A20C; --cash:#15805A; --renu:#4450D6; --own:#AE2A7A; --bad:#BF2F28;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font:15px/1.45 'DM Sans',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
h1,h2,h3,.big,.evn,.tk .n{font-family:Sora,system-ui,sans-serif;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700}
h3{font-size:15px;font-weight:600;margin-bottom:10px}
.sub{color:var(--muted);font-size:13.5px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}

/* Header */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--night);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 12px 16px}
.ev{flex:1;min-width:0}
.evn{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evs{font-size:12.5px;opacity:.72}
.sync{font-size:12px;padding:5px 11px 5px 23px;border-radius:99px;background:rgba(255,255,255,.1);position:relative;white-space:nowrap}
.sync::before{content:'';position:absolute;left:10px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:#43D99B}
.sync.saving::before{background:var(--gold);animation:pulse 1s infinite}
.sync.off::before{background:#9DA2C4}
@keyframes pulse{50%{opacity:.25}}
.icon{background:none;border:0;padding:8px;border-radius:10px;display:grid;place-items:center;color:inherit;line-height:0}
.icon:hover{background:rgba(127,127,160,.14)}

main{max-width:760px;margin:0 auto;padding:18px 16px calc(150px + env(safe-area-inset-bottom))}

/* Bottom nav */
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bot button{flex:1;max-width:170px;background:none;border:0;padding:13px 4px 14px;font-size:13.5px;font-weight:500;color:var(--muted);position:relative}
nav.bot button.on{color:var(--ink);font-weight:700}
nav.bot button.on::after{content:'';position:absolute;top:-1px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}

/* Hero numbers */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:2px 2px 14px}
.big{font-size:46px;font-weight:700;line-height:1;letter-spacing:-.035em}
.of{color:var(--muted);font-size:14px;margin-top:6px}
.owe{text-align:right}
.owe span{display:block;font-size:13px;color:var(--muted)}
.owe b{font:700 23px Sora,sans-serif;letter-spacing:-.02em}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:20px}
.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}

/* Controls */
.bar{display:flex;gap:8px;margin-bottom:10px}
.bar > *{flex:1 1 0;min-width:0}
input,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-size:16px}
input:focus,select:focus{border-color:var(--night);outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:var(--paper);padding:6px 12px;border-radius:99px;font-size:13.5px;font-weight:500}
.chip b{font-weight:700;margin-left:3px;opacity:.7}
.chip.on{background:var(--night);color:#fff;border-color:var(--night)}
.chip.on b{opacity:.85}
.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px;flex-wrap:wrap}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}
.dot.cash{background:var(--cash)}.dot.renu{background:var(--renu)}.dot.own{background:var(--own)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}

.primary{display:block;width:100%;border:0;border-radius:12px;background:var(--night);color:#fff;font-weight:700;padding:14px;font-size:15.5px;margin-top:20px}
.primary.sm{display:inline-block;width:auto;padding:9px 14px;margin:0;font-size:14px;border-radius:10px}
.ghost{display:block;width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px;font-weight:600;margin-top:10px;text-align:center;text-decoration:none;color:var(--ink)}
.ghost.sm{display:inline-block;width:auto;padding:7px 12px;margin:0;font-size:13.5px;border-radius:10px}
.danger{color:var(--bad)}
.wa{background:#1FA855;border-color:#1FA855;color:#fff}

/* Pass tiles: ticket stubs with side notches */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.tk{position:relative;height:66px;border:0;border-radius:9px;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0 10px;
  -webkit-mask:radial-gradient(circle 6px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 6px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 6px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 6px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;
  transition:transform .12s}
.tk:active{transform:scale(.95)}
.tk .n{font-weight:700;font-size:17px;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .l{font-size:11px;opacity:.78;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk.cash,.tk.renu,.tk.own{color:#fff;box-shadow:none}
.tk.cash{background:var(--cash)}.tk.renu{background:var(--renu)}.tk.own{background:var(--own)}
.tk.pool{background:#E7E9F2;box-shadow:inset 0 0 0 1.5px #E7E9F2;color:var(--muted)}
.tk.sel{box-shadow:inset 0 0 0 3px var(--gold);background:#FFF6E0}
.tk.p::after{content:'';position:absolute;top:7px;right:12px;width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 1s infinite}

/* Cards & lists */
.card{background:var(--paper);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin-bottom:12px}
.split i{display:block;height:100%}
.split i.cash{background:var(--cash)}.split i.renu{background:var(--renu)}.split i.own{background:var(--own)}
.lr{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:5px 0;font-size:14.5px}
.lr b{min-width:72px;text-align:right}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.facts div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.facts b{display:block;font:700 18px Sora,sans-serif}
.facts span{font-size:12.5px;color:var(--muted)}
.tblw{overflow-x:auto;margin:0 -4px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:0 4px 8px}
.tbl td{padding:9px 4px;border-top:1px solid var(--line)}
.tbl .r{text-align:right}
.li{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;text-align:left}
.li:first-of-type{border-top:0}
.li > div{flex:1;min-width:0}
.li .sub{font-size:12.5px}
.person{display:flex;align-items:center;gap:12px;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px;text-align:left}
.person > div:first-child{flex:1;min-width:0}
.person .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person.inactive{opacity:.55}
.pn{text-align:right}
.pn b{display:block;font:700 16px Sora,sans-serif}
.pn span{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;background:#EEF0F8;color:var(--muted);padding:1px 7px;border-radius:6px;margin-left:6px;vertical-align:2px}
.money{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px}
.money .mh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.money .mh b{font:700 17px Sora,sans-serif}
.money .mh b.zero{color:var(--cash)}
.money .md{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.empty{text-align:center;padding:40px 16px;color:var(--muted);background:var(--paper);border:1.5px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* Selection bar */
.selbar{position:fixed;left:12px;right:12px;bottom:calc(60px + env(safe-area-inset-bottom));max-width:736px;margin:0 auto;background:var(--night);color:#fff;border-radius:14px;padding:9px 9px 9px 16px;display:flex;align-items:center;gap:8px;z-index:7;box-shadow:0 10px 28px rgba(27,30,74,.32)}
.selbar b{flex:1;font-weight:600}
.selbar button{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--gold);color:var(--night)}
.selbar button.alt{background:rgba(255,255,255,.14);color:#fff}

/* Bottom sheet */
#scrim{position:fixed;inset:0;background:rgba(18,20,52,.46);opacity:0;transition:opacity .2s;z-index:20}
#scrim.open{opacity:1}
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom));z-index:21;transform:translateY(100%);transition:transform .22s ease-out;overscroll-behavior:contain}
#sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
.sh-h h2{font-size:23px}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 6px}
.lbl i{font-style:normal;font-weight:400}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{--c:var(--ink);border:2px solid color-mix(in srgb,var(--c) 30%,white);background:var(--paper);color:var(--c);border-radius:12px;padding:15px 4px;font-weight:700;font-size:14.5px}
.mode.cash{--c:var(--cash)}.mode.renu{--c:var(--renu)}.mode.own{--c:var(--own)}
.mode.on{background:var(--c);border-color:var(--c);color:#fff}
.row{display:flex;gap:8px}
.row > select{flex:1}
.row > button{margin:0;width:auto;flex:none;padding:0 18px}
.check{display:flex;align-items:center;gap:10px;margin-top:16px;font-weight:500}
.check input{width:20px;height:20px}
.divd{height:1px;background:var(--line);margin:24px 0 18px}
.done{text-align:center;padding:10px 0 4px}
.done .tick{width:56px;height:56px;border-radius:50%;background:var(--cash);color:#fff;display:grid;place-items:center;margin:4px auto 12px}

/* Toast */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translate(-50%,-12px);background:var(--night);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--bad)}

/* Login */
.login{min-height:100vh;background:var(--night);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:calc(env(safe-area-inset-top) + 28px) 0 0}
.lg-top{padding:0 24px 32px;max-width:520px;width:100%;margin:0 auto}
.stubs{display:flex;gap:7px;margin-bottom:26px}
.stubs i{width:44px;height:30px;border-radius:5px;background:rgba(255,255,255,.12);-webkit-mask:radial-gradient(circle 4px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 4px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 4px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 4px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat}
.stubs i:nth-child(3){background:var(--gold)}
.lg-top h1{font-size:clamp(40px,11vw,60px);line-height:.98;font-weight:700;letter-spacing:-.04em}
.lg-top p{opacity:.72;margin-top:10px;font-size:15.5px}
.lg-card{background:var(--paper);color:var(--ink);border-radius:22px 22px 0 0;padding:10px 24px calc(28px + env(safe-area-inset-bottom));max-width:520px;width:100%;margin:0 auto}
.loading{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--muted)}

@media (min-width:560px){ .login{justify-content:center;padding:40px 0} .lg-card{border-radius:22px} }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{transition:none!important;animation:none!important} }
</style>

<body>
<div id="app"></div>
<div id="scrim" hidden></div>
<div id="sheet" role="dialog" aria-modal="true" aria-label="Details" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════
   Safed Raas 2.0 — Pass Tracker PWA
   Same pattern as the Finance Manager: single index.html + config.json,
   Apps Script backend, Google Sheets store.
   Sync: local-first ops queue → debounced POST → server applies per row
   under a lock. Smart polling on a cheap getVersion every 5 s; full data
   is fetched only when the version changes.
   ══════════════════════════════════════════════════════════════ */

const LS = 'srpass_v1';
const MODES = ['Cash', 'Renu UPI', 'Own UPI'];
const MCLS = { 'Cash': 'cash', 'Renu UPI': 'renu', 'Own UPI': 'own' };
const MSHORT = { 'Cash': 'Cash', 'Renu UPI': 'Renu UPI', 'Own UPI': 'Own UPI' };
const POLL_MS = 5000;

let API = '';
let S = load();          // persisted: session, server snapshot, version, pending queue
let V = null;            // view = server snapshot + pending queue replayed
let SH = {};             // current bottom-sheet state
const net = { ok: navigator.onLine };
const ui = { tab: null, filter: 'unsold', q: '', seller: '', selecting: false, sel: new Set() };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rs = n => '₹' + Math.round(n || 0).toLocaleString('en-IN');
const natCmp = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const isAdmin = () => S.session?.user?.role === 'admin';
const byNo = no => V.passes.find(p => p.no === String(no));
const nm = id => { const t = V.team.find(x => x.id === id); return t ? t.name : (id ? 'Unknown' : 'Pool'); };
const first = s => String(s || '').split(' ')[0];
const settleOf = id => V.settle.filter(s => s.sid === id);
const fmtTime = t => t ? new Date(t).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(LS));
    if (s && typeof s === 'object') return { session: s.session || null, server: s.server || null, v: s.v || null, queue: s.queue || [] };
  } catch (e) {}
  return { session: null, server: null, v: null, queue: [] };
}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }

/* ── Pass number helpers ─────────────────────────────── */
function parseRange(txt) {
  const out = [];
  const parts = String(txt || '').replace(/\s*[-–]\s*/g, '-').split(/[,\s]+/);
  for (const part of parts) {
    if (!part) continue;
    const m = part.match(/^([A-Za-z]*)(\d+)-([A-Za-z]*)(\d+)$/);
    if (m) {
      let a = +m[2], b = +m[4];
      if (b < a) [a, b] = [b, a];
      if (b - a > 2000) throw new Error('A range can have at most 2,000 passes');
      const pad = m[2].startsWith('0') ? m[2].length : 0;
      for (let i = a; i <= b; i++) out.push(m[1] + (pad ? String(i).padStart(pad, '0') : i));
    } else out.push(part);
  }
  return [...new Set(out)];
}
function compress(nos) {
  const s = [...nos].sort(natCmp), g = [];
  for (const n of s) {
    const last = g[g.length - 1];
    if (last && /^\d+$/.test(n) && /^\d+$/.test(last[1]) && +n === +last[1] + 1) last[1] = n;
    else g.push([n, n]);
  }
  return g.map(([a, b]) => a === b ? a : a + '–' + b).join(', ');
}
function statsFor(passes, settle) {
  const s = { assigned: 0, sold: 0, cash: 0, renu: 0, own: 0, settled: 0, n: { 'Cash': 0, 'Renu UPI': 0, 'Own UPI': 0 } };
  passes.forEach(p => {
    if (p.sid) s.assigned++;
    if (p.st === 'sold') {
      s.sold++; s.n[p.m] = (s.n[p.m] || 0) + 1;
      if (p.m === 'Cash') s.cash += p.a; else if (p.m === 'Renu UPI') s.renu += p.a; else if (p.m === 'Own UPI') s.own += p.a;
    }
  });
  settle.forEach(x => s.settled += x.amt);
  s.total = s.cash + s.renu + s.own;
  s.collect = s.cash + s.own - s.settled;   // Renu UPI lands directly with Renu
  return s;
}

/* ── Local-first view: server snapshot + queued ops ───── */
function buildView() {
  if (!S.server) { V = null; return; }
  const d = JSON.parse(JSON.stringify(S.server));
  d.settle = d.settle || []; d.team = d.team || []; d.passes = d.passes || [];
  const pi = {};
  d.passes.forEach(p => pi[p.no] = p);
  for (const op of S.queue) applyLocal(d, pi, op);
  d.passes.sort((a, b) => natCmp(a.no, b.no));
  V = d;
}
function applyLocal(d, pi, op) {
  const me = d.me;
  switch (op.type) {
    case 'sell': case 'edit': {
      const p = pi[op.no]; if (!p) return;
      if (op.type === 'sell' && p.st === 'sold') return;
      if (!p.sid) p.sid = me.id;
      Object.assign(p, { st: 'sold', m: op.mode, a: +op.amount || 0, b: op.buyer || '', bp: op.phone || '', u: op.ts, ub: me.name, _p: 1 });
      if (op.type === 'sell') p.t = op.ts;
      break;
    }
    case 'unsell': {
      const p = pi[op.no]; if (!p) return;
      Object.assign(p, { st: 'unsold', m: '', a: 0, b: '', bp: '', t: 0, _p: 1 });
      break;
    }
    case 'assign':
      for (const no of op.nos) {
        const p = pi[no];
        if (!p) { const n = { no, sid: op.sid, st: 'unsold', m: '', a: 0, b: '', bp: '', t: 0, u: op.ts, ub: me.name, _p: 1 }; d.passes.push(n); pi[no] = n; }
        else if (!(p.st === 'sold' && p.sid !== op.sid)) { p.sid = op.sid; p._p = 1; }
      }
      break;
    case 'unassign':
      op.nos.forEach(no => { const p = pi[no]; if (p && p.st !== 'sold') { p.sid = ''; p._p = 1; } });
      break;
    case 'remove': {
      const rm = new Set(op.nos.filter(n => pi[n] && pi[n].st !== 'sold'));
      d.passes = d.passes.filter(p => !rm.has(p.no));
      rm.forEach(n => delete pi[n]);
      break;
    }
    case 'seller': {
      const x = d.team.find(t => t.id === op.p.id);
      if (x) Object.assign(x, op.p); else d.team.push({ ...op.p });
      break;
    }
    case 'settle':
      if (!d.settle.some(s => s.id === op.id)) d.settle.push({ id: op.id, sid: op.sid, amt: +op.amt || 0, note: op.note || '', d: op.ts, by: me.name, _p: 1 });
      break;
    case 'unsettle':
      d.settle = d.settle.filter(s => s.id !== op.id);
      break;
    case 'config':
      Object.assign(d.cfg, op.cfg);
      if (op.cfg.price !== undefined) d.cfg.price = +op.cfg.price || 0;
      break;
  }
}

/* ── Network ─────────────────────────────────────────── */
async function api(action, extra = {}) {
  const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 30000);
  try {
    const auth = S.session ? { phone: S.session.phone, pin: S.session.pin } : null;
    const res = await fetch(API, {
      method: 'POST', redirect: 'follow', signal: ctrl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // no CORS preflight for Apps Script
      body: JSON.stringify({ action, auth, ...extra })
    });
    return await res.json();
  } finally { clearTimeout(to); }
}

function enqueue(ops) {
  (Array.isArray(ops) ? ops : [ops]).forEach(op => { op.opId = uid(); op.ts = Date.now(); S.queue.push(op); });
  save(); buildView(); render(); scheduleFlush(150);
}

let flushT = null, flushing = false, pulling = false;
function scheduleFlush(ms = 200) { clearTimeout(flushT); flushT = setTimeout(flush, ms); }

async function flush() {
  if (flushing || !S.queue.length || !S.session || !API) return;
  flushing = true; setSync();
  const batch = S.queue.slice(0, 40);
  let retryIn = 300;
  try {
    const r = await api('ops', { ops: batch });
    net.ok = true;
    if (r.ok) {
      const ids = new Set(batch.map(o => o.opId));
      S.queue = S.queue.filter(o => !ids.has(o.opId));
      const bad = (r.results || []).filter(x => !x.ok);
      if (bad.length) toast(bad.length === 1 ? bad[0].msg : bad[0].msg + ` (and ${bad.length - 1} more)`, 'err', 5000);
      if (r.data && r.data.ok) { S.server = r.data; S.v = r.data.v; }
      save(); buildView(); render();
    } else if (r.error === 'AUTH') { flushing = false; return forceLogout(r.msg); }
    else { retryIn = 5000; if (r.error !== 'BUSY') toast(r.msg || 'Could not save. Retrying.', 'err'); }
  } catch (e) { net.ok = false; retryIn = 4000; }
  flushing = false; setSync();
  if (S.queue.length) scheduleFlush(retryIn);
}

async function pull() {
  if (pulling || !S.session || !API) return;
  pulling = true;
  try {
    const r = await api('getData');
    net.ok = true;
    if (r.ok) {
      S.server = r; S.v = r.v;
      S.session.user = r.me;
      save(); buildView(); render();
    } else if (r.error === 'AUTH') { pulling = false; return forceLogout(r.msg); }
  } catch (e) { net.ok = false; if (!V) render(); }
  pulling = false; setSync();
}

async function poll() {
  if (!S.session || document.hidden || !API) return;
  if (S.queue.length) { flush(); return; }
  if (pulling || flushing) return;
  try {
    const r = await api('getVersion');
    net.ok = true;
    if (r.ok && r.v !== S.v) await pull();
  } catch (e) { net.ok = false; }
  setSync();
}

function syncState() { if (!navigator.onLine || !net.ok) return 'off'; return S.queue.length ? 'saving' : 'live'; }
function syncText() {
  const n = S.queue.length, s = syncState();
  if (s === 'off') return n ? `Offline, ${n} waiting` : 'Offline';
  return s === 'saving' ? `Saving ${n}` : 'Live';
}
function setSync() { const el = $('#syncpill'); if (el) { el.className = 'sync ' + syncState(); el.textContent = syncText(); } }

/* ── Rendering ───────────────────────────────────────── */
function render() {
  const app = $('#app');
  const ae = document.activeElement;
  const fid = ae && ae.id && app.contains(ae) ? ae.id : null;
  const caret = fid && typeof ae.selectionStart === 'number' ? ae.selectionStart : null;

  if (!S.session) { if (!$('#lform')) app.innerHTML = loginHTML(); return; }
  if (!V) { app.innerHTML = `<div class="loading"><div><p>${net.ok ? 'Loading passes…' : 'Could not reach the server.'}</p>${net.ok ? '' : '<button class="ghost sm" data-act="retry" style="margin-top:12px">Try again</button>'}</div></div>`; return; }

  const tabs = isAdmin() ? ['overview', 'passes', 'team', 'money'] : ['mine', 'summary'];
  if (!tabs.includes(ui.tab)) ui.tab = tabs[0];
  app.innerHTML = headerHTML() + '<main>' + TAB[ui.tab]() + '</main>' + navHTML(tabs) + selBarHTML();

  if (fid) {
    const el = document.getElementById(fid);
    if (el) { el.focus({ preventScroll: true }); if (caret !== null) try { el.setSelectionRange(caret, caret); } catch (e) {} }
  }
}

    h += `<button class="ghost danger" data-act="unsell">Mark unsold</button>`;
  }
  if (isAdmin() && !sold && ps.length === 1) {
    h += `<div class="divd"></div><label class="lbl" for="f_to" style="margin-top:0">Give this pass to</label>
      <div class="row"><select id="f_to">${personOptions(p.sid)}</select><button class="ghost" data-act="assignone">Move</button></div>
      <button class="ghost danger" data-act="removeone">Delete this pass</button>`;
  }
  openSheet(h);
}

function waLink(phone, text) {
  let d = String(phone || '').replace(/\D/g, '');
  if (d.length === 10) d = '91' + d;
  if (d.length < 11) return '';
  return 'https://wa.me/' + d + (text ? '?text=' + encodeURIComponent(text) : '');
}
function waMsg(nos, buyer) {
  const c = V.cfg, many = nos.length > 1;
  return `Hi${buyer ? ' ' + buyer : ''}! Your ${c.eventName} pass${many ? 'es' : ''} (No. ${compress(nos)}) ${many ? 'are' : 'is'} confirmed.` +
    (c.eventDate ? ` See you on ${c.eventDate}.` : '') + `\n\n${V.me.name}${c.org ? ', ' + c.org : ''}`;
}

function openAssign(nos) {
  SH = { kind: 'assign', nos };
  let h = sheetHead(nos ? `Give ${nos.length} pass${nos.length > 1 ? 'es' : ''}` : 'Add or give passes');
  if (nos) h += `<p class="sub">${esc(compress(nos))}</p>`;
  else h += `<p class="sub">New numbers are created. Existing unsold ones move to the person you pick.</p>
    <label class="lbl" for="f_range">Pass numbers <i>e.g. 1001-1050, 1075, 1080-1090</i></label><input id="f_range" autocomplete="off">`;
  h += `<label class="lbl" for="f_to">Give to</label><select id="f_to">${personOptions('')}</select>
    <button class="primary" data-act="doassign">Give passes</button>`;
  openSheet(h);
}

function openPerson(id) {
  const t = id ? V.team.find(x => x.id === id) : null;
  SH = { kind: 'person', pid: t ? t.id : 'U' + uid() };
  let h = sheetHead(t ? esc(t.name) : 'Add person');
  if (t) {
    const ps = V.passes.filter(p => p.sid === t.id), st = statsFor(ps, settleOf(t.id));
    h += `<p class="sub">${st.sold} of ${st.assigned} sold, ${rs(st.collect)} to hand over</p>`;
  }
  h += `<label class="lbl" for="f_name">Name</label><input id="f_name" autocomplete="off" value="${t ? esc(t.name) : ''}">
    <label class="lbl" for="f_phone">Phone number <i>(used to log in)</i></label><input id="f_phone" type="tel" inputmode="numeric" autocomplete="off" value="${t ? esc(t.phone) : ''}">
    <label class="lbl" for="f_pin">PIN <i>(4 to 6 digits)</i></label><input id="f_pin" inputmode="numeric" autocomplete="off" value="${t && t.pin ? esc(t.pin) : ''}">
    <label class="lbl" for="f_role">Role</label><select id="f_role"><option value="seller">Seller: sees and sells own passes</option><option value="admin" ${t && t.role === 'admin' ? 'selected' : ''}>Organiser: sees everything, gives passes, records handovers</option></select>
    ${t ? `<label class="check"><input type="checkbox" id="f_active" ${t.active ? 'checked' : ''}> Can log in</label>` : ''}
    <button class="primary" data-act="saveperson">${t ? 'Save changes' : 'Add person'}</button>`;
  if (t) {
    const ps = V.passes.filter(p => p.sid === t.id), unsold = ps.filter(p => p.st !== 'sold');
    h += `<div class="divd"></div><h3>Passes</h3><p class="sub">${ps.length ? esc(compress(ps.map(p => p.no))) : 'None yet'}</p>
      <label class="lbl" for="f_range">Give more passes <i>e.g. 1001-1050</i></label><input id="f_range" autocomplete="off">
      <button class="ghost" data-act="assignrange">Give these passes</button>
      ${unsold.length ? `<button class="ghost danger" data-act="poolall">Take back ${unsold.length} unsold pass${unsold.length > 1 ? 'es' : ''}</button>` : ''}`;
  }
  openSheet(h);
}

function openSettings() {
  SH = { kind: 'settings' };
  const c = V.cfg;
  openSheet(sheetHead('Event settings') + `
    <label class="lbl" for="f_ev">Event name</label><input id="f_ev" value="${esc(c.eventName)}">
    <label class="lbl" for="f_date">Event date <i>(shown in WhatsApp confirmations)</i></label><input id="f_date" value="${esc(c.eventDate || '')}">
    <label class="lbl" for="f_price">Pass price</label><input id="f_price" type="number" inputmode="numeric" min="0" value="${c.price}">
    <label class="lbl" for="f_org">Organised by</label><input id="f_org" value="${esc(c.org || '')}">
    <button class="primary" data-act="savesettings">Save settings</button>`);
}

function openHandover(id) {
  const t = V.team.find(x => x.id === id); if (!t) return;
  const st = statsFor(V.passes.filter(p => p.sid === id), settleOf(id));
  SH = { kind: 'handover', sid: id };
  openSheet(sheetHead('Handover from ' + esc(first(t.name))) + `
    <p class="sub">Cash ${rs(st.cash)} and Own UPI ${rs(st.own)} collected, ${rs(st.settled)} already handed over.</p>
    <label class="lbl" for="f_hamt">Amount received</label><input id="f_hamt" type="number" inputmode="numeric" min="1" value="${st.collect > 0 ? st.collect : ''}">
    <label class="lbl" for="f_hnote">Note <i>(optional)</i></label><input id="f_hnote" placeholder="e.g. Cash to Renu, UPI to club account" autocomplete="off">
    <button class="primary" data-act="savehandover">Record handover</button>`);
}

/* ── Actions ─────────────────────────────────────────── */
function doAssign(nos, sid) {
  if (!nos.length) { toast('Enter pass numbers first', 'err'); return false; }
  const moving = nos.filter(n => { const p = byNo(n); return p && p.st !== 'sold' && p.sid && p.sid !== sid; });
  const sold = nos.filter(n => { const p = byNo(n); return p && p.st === 'sold' && p.sid !== sid; });
  if (moving.length && !confirm(`${moving.length} of these passes are with someone else right now. Move them to ${sid ? nm(sid) : 'the pool'}?`)) return false;
  enqueue({ type: 'assign', nos, sid });
  const n = nos.length - sold.length;
  toast(`${n} pass${n === 1 ? '' : 'es'} given to ${sid ? nm(sid) : 'the pool'}` + (sold.length ? `. ${sold.length} already sold, left as is` : ''));
  return true;
}

const ACT = {
  tab(a) { ui.tab = a.dataset.v; ui.selecting = false; ui.sel.clear(); ui.q = ''; ui.filter = ui.tab === 'passes' ? 'all' : 'unsold'; render(); scrollTo(0, 0); },
  filter(a) { ui.filter = a.dataset.v; render(); },
  selmode() { ui.selecting = !ui.selecting; ui.sel.clear(); if (ui.selecting && ui.filter === 'sold') ui.filter = isAdmin() ? 'all' : 'unsold'; render(); },
  sellsel() { const nos = [...ui.sel]; if (nos.length) openSale(nos); },
  assignsel() { const nos = [...ui.sel]; if (nos.length) openAssign(nos); },
  openpass(a) { openSale([a.dataset.no]); },
  addpasses() { openAssign(null); },
  person(a) { openPerson(a.dataset.id); },
  settings() { openSettings(); },
  handover(a) { openHandover(a.dataset.id); },
  unsettle(a) {
    const s = V.settle.find(x => x.id === a.dataset.id);
    if (s && confirm(`Delete the ${rs(s.amt)} handover from ${nm(s.sid)}?`)) enqueue({ type: 'unsettle', id: s.id });
  },
  export() { exportCSV(); },
  retry() { pull(); render(); },
  logout() {
    if (S.queue.length && !confirm(`${S.queue.length} change${S.queue.length > 1 ? 's have' : ' has'} not reached the server yet and will be lost. Log out anyway?`)) return;
    S = { session: null, server: null, v: null, queue: [] }; save(); V = null; closeSheet(); render();
  }
};

const SACT = {
  close() { closeSheet(); },
  savesale() {
    const amt = Number($('#f_amt').value);
    if (!SH.mode) return toast('Choose how the payment was received', 'err');
    if (!(amt >= 0) || $('#f_amt').value === '') return toast('Enter the amount', 'err');
    const buyer = $('#f_buyer').value.trim(), phone = $('#f_bphone').value.replace(/[^\d+]/g, '');
    const nos = SH.nos;
    if (SH.sold) enqueue({ type: 'edit', no: nos[0], mode: SH.mode, amount: amt, buyer, phone });
    else enqueue(nos.map(no => ({ type: 'sell', no, mode: SH.mode, amount: amt, buyer, phone })));
    ui.sel.clear(); ui.selecting = false; render();
    const wa = !SH.sold && waLink(phone);
    if (wa) {
      openSheet(`<div class="done"><div class="tick"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
        <h2>${nos.length > 1 ? nos.length + ' passes sold' : 'Pass ' + esc(nos[0]) + ' sold'}</h2><p class="sub">${esc(SH.mode)}, ${rs(amt * nos.length)}</p></div>
        <a class="primary wa" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="${waLink(phone, waMsg(nos, buyer))}" data-act="close">Send confirmation on WhatsApp</a>
        <button class="ghost" data-act="close">Done</button>`);
    } else {
      closeSheet();
      toast(SH.sold ? 'Changes saved' : (nos.length > 1 ? nos.length + ' passes marked sold' : 'Pass ' + nos[0] + ' marked sold'));
    }
  },
  unsell() {
    const no = SH.nos[0];
    if (!confirm(`Mark pass ${no} as unsold? The payment details will be cleared.`)) return;
    enqueue({ type: 'unsell', no }); closeSheet(); toast('Pass ' + no + ' marked unsold');
  },
  assignone() { if (doAssign([SH.nos[0]], $('#f_to').value)) closeSheet(); },
  removeone() {
    const no = SH.nos[0];
    if (!confirm(`Delete pass ${no} from the list? Use this only for numbers entered by mistake.`)) return;
    enqueue({ type: 'remove', nos: [no] }); closeSheet(); toast('Pass ' + no + ' deleted');
  },
  doassign() {
    let nos = SH.nos;
    if (!nos) { try { nos = parseRange($('#f_range').value); } catch (e) { return toast(e.message, 'err'); } }
    if (doAssign(nos, $('#f_to').value)) { ui.sel.clear(); ui.selecting = false; render(); closeSheet(); }
  },
  assignrange() {
    let nos; try { nos = parseRange($('#f_range').value); } catch (e) { return toast(e.message, 'err'); }
    if (doAssign(nos, SH.pid)) closeSheet();
  },
  poolall() {
    const nos = V.passes.filter(p => p.sid === SH.pid && p.st !== 'sold').map(p => p.no);
    if (!confirm(`Take back ${nos.length} unsold passes from ${nm(SH.pid)}? They go back to the pool.`)) return;
    enqueue({ type: 'unassign', nos }); closeSheet(); toast(nos.length + ' passes back in the pool');
  },
  saveperson() {
    const name = $('#f_name').value.trim(), phone = $('#f_phone').value.replace(/\D/g, '').slice(-10), pin = $('#f_pin').value.trim();
    const role = $('#f_role').value, active = $('#f_active') ? $('#f_active').checked : true;
    if (!name) return toast('Enter a name', 'err');
    if (phone.length !== 10) return toast('Enter a 10-digit phone number', 'err');
    if (!/^\d{4,6}$/.test(pin)) return toast('PIN must be 4 to 6 digits', 'err');
    if (V.team.some(t => t.id !== SH.pid && t.phone === phone)) return toast('Another person already uses this phone number', 'err');
    if (SH.pid === V.me.id && (role !== 'admin' || !active)) return toast('You cannot remove your own organiser access', 'err');
    const isNew = !V.team.some(t => t.id === SH.pid);
    enqueue({ type: 'seller', p: { id: SH.pid, name, phone, pin, role, active } });
    closeSheet(); toast(isNew ? name + ' added. Share their phone and PIN with them.' : 'Saved');
  },
  savesettings() {
    const cfg = { eventName: $('#f_ev').value.trim() || 'Safed Raas 2.0', eventDate: $('#f_date').value.trim(), price: Number($('#f_price').value) || 0, org: $('#f_org').value.trim() };
    enqueue({ type: 'config', cfg }); closeSheet(); toast('Settings saved');
  },
  savehandover() {
    const amt = Number($('#f_hamt').value);
    if (!(amt > 0)) return toast('Enter the amount received', 'err');
    enqueue({ type: 'settle', id: 'S' + uid(), sid: SH.sid, amt, note: $('#f_hnote').value.trim() });
    closeSheet(); toast(rs(amt) + ' handover recorded');
  }
};

function tapPass(no) {
  const p = byNo(no); if (!p) return;
  if (ui.selecting) {
    if (p.st === 'sold') return toast('Pass ' + no + ' is already sold');
    ui.sel.has(no) ? ui.sel.delete(no) : ui.sel.add(no);
    render(); return;
  }
  openSale([no]);
}

function exportCSV() {
  const rows = [['Pass No', 'With', 'Status', 'Mode', 'Amount', 'Buyer', 'Buyer Phone', 'Sold At', 'Updated By']]
    .concat(V.passes.map(p => [p.no, p.sid ? nm(p.sid) : 'Pool', p.st, p.m, p.st === 'sold' ? p.a : '', p.b, p.bp, p.t ? new Date(p.t).toLocaleString('en-IN') : '', p.ub]));
  const csv = rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
  a.download = (V.cfg.eventName || 'passes').replace(/[^\w]+/g, '-') + '-passes.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

function forceLogout(msg) {
  S = { session: null, server: S.server ? { cfg: S.server.cfg } : null, v: null, queue: [] };
  save(); V = null; closeSheet(); render();
  toast(msg || 'Log in again', 'err', 5000);
}

let toastT = null;
function toast(msg, kind, ms = 2800) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show' + (kind === 'err' ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => { t.className = kind === 'err' ? 'err' : ''; }, ms);
}

async function doLogin(e) {
  e.preventDefault();
  const phone = $('#l_phone').value.replace(/\D/g, '').slice(-10), pin = $('#l_pin').value.trim();
  const msg = $('#l_msg'), btn = $('#l_btn');
  if (!API) { msg.textContent = 'The app is not connected yet. Add the Apps Script URL to config.json.'; return; }
  if (phone.length !== 10 || !pin) { msg.textContent = 'Enter your 10-digit phone number and PIN.'; return; }
  btn.disabled = true; btn.textContent = 'Checking…'; msg.textContent = '';
  try {
    const r = await api('login', { auth: { phone, pin } });
    if (r.ok) {
      S = { session: { phone, pin, user: r.me }, server: null, v: null, queue: [] };
      save(); ui.tab = null; V = null;
      $('#app').innerHTML = ''; render();
      await pull();
      return;
    }
    msg.textContent = r.msg || 'Could not log in.';
  } catch (err) { msg.textContent = 'Could not reach the server. Check your internet and try again.'; }
  btn.disabled = false; btn.textContent = 'Log in';
}

/* ── Wiring ──────────────────────────────────────────── */
const app = $('#app');
app.addEventListener('click', e => {
  const tk = e.target.closest('.tk');
  if (tk) return tapPass(tk.dataset.no);
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) ACT[a.dataset.act](a);
});
app.addEventListener('input', e => { if (e.target.id === 'q') { ui.q = e.target.value; render(); } });
app.addEventListener('change', e => { if (e.target.id === 'fseller') { ui.seller = e.target.value; render(); } });
app.addEventListener('submit', e => { if (e.target.id === 'lform') doLogin(e); });

$('#sheet').addEventListener('click', e => {
  const m = e.target.closest('[data-mode]');
  if (m) {
    SH.mode = m.dataset.mode;
    $('#sheet').querySelectorAll('.mode').forEach(b => { b.classList.toggle('on', b === m); b.setAttribute('aria-pressed', b === m); });
    return;
  }
  const a = e.target.closest('[data-act]');
  if (a && SACT[a.dataset.act]) SACT[a.dataset.act](a);
});
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

async function boot() {
  try { const r = await fetch('config.json', { cache: 'no-store' }); API = (await r.json()).apiUrl || ''; } catch (e) {}
  if (API.includes('PASTE_')) API = '';
  buildView(); render();
  if (S.session && API) { pull(); if (S.queue.length) scheduleFlush(500); }
  setInterval(poll, POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
  addEventListener('online', () => { net.ok = true; setSync(); flush(); poll(); });
  addEventListener('offline', setSync);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
</script>
</body>
</html>
